 for(let i=0;i<z.bu;i++){const[x,y]=band(.8,3),b=new THREE.Mesh(new THREE.IcosahedronGeometry(.45+Math.random()*.4,1),smat([0x7a8f2f,0xb5651d,0x8c9a3a][i%3]));b.scale.y=.75;b.position.set(x,.3,y);b.castShadow=true;W.add(b)}
 const fc=[0xff6b81,0xffd93d,0xffffff,0xb48cff,0xff9f43];
 for(let i=0;i<z.fl;i++){const[x,y]=band(.8,3.5),fg=new THREE.Group(),st=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.35,5),mat(0x5a7a2a)),hd=new THREE.Mesh(SG,mat(fc[Math.random()*5|0]));st.position.y=.17;hd.position.y=.38;hd.scale.setScalar(1.6);fg.add(st,hd);fg.position.set(x,0,y);W.add(fg)}
 for(let i=0;i<z.pa;i++){const st=new THREE.Mesh(new THREE.CylinderGeometry(.55,.6,.03,7),mat(0xbdb5a5));st.position.set(Math.sin(i*.6)*1.3,.015,s-1.5-i*1.35);st.rotation.y=i;W.add(st)}
 scatter(Math.round(4*s*s*5.5));for(let i=0;i<3+zi;i++)pile();capN=leaves.length}
function drop(){const s=ZONES[S.zi].s-.8;let x,y;
 if(trees.length){const t=trees[Math.random()*trees.length|0];x=cl(t.x+(Math.random()-.5)*3,s);y=cl(t.z+(Math.random()-.5)*3,s)}else{x=(Math.random()*2-1)*s;y=(Math.random()*2-1)*s}
 addLeaf(x,3.3+Math.random(),y,.25,.5+Math.random()*.4,1,.95)}

/* ---------- aim, outline, effects ---------- */
const fwd=new THREE.Vector3(),OLMat=LT.map(t=>new THREE.MeshBasicMaterial({map:t,color:0x111111,alphaTest:.3,side:THREE.DoubleSide})),OLM=new THREE.Mesh(PG,OLMat[0]);
OLM.rotation.order='YXZ';OLM.visible=false;sc.add(OLM);let aim=null;
function setAim(l){if(l===aim)return;if(aim)paint(aim,1);aim=l;OLM.visible=!!l;
 if(l){paint(l,1.45);OLM.material=OLMat[l.k];OLM.position.set(l.x,l.y,l.z);OLM.rotation.set(l.rx,l.ry,l.rz);OLM.scale.setScalar(l.s*1.18);OLM.translateY(-.01)}
 xh.classList.toggle('on',!!l)}
function aimUpdate(){cam.getWorldDirection(fwd);const rng=3.5+TOOLS[S.cur].r*.35,r2=rng*rng,cx=cam.position.x,cy=cam.position.y,cz=cam.position.z;let best=null,bs=1;
 for(const l of leaves){if(l.f)continue;const dx=l.x-cx,dy=l.y-cy,dz=l.z-cz,d2=dx*dx+dy*dy+dz*dz;if(d2>r2||d2<.16)continue;
  const d=Math.sqrt(d2),c=(dx*fwd.x+dy*fwd.y+dz*fwd.z)/d;if(c<.9)continue;
  const v=Math.acos(Math.min(1,c))/(.03+.3*l.s/d)-l.y*.25;if(v<bs){bs=v;best=l}}
 setAim(best)}
function fly(l,delay){const m=new THREE.Mesh(PG,new THREE.MeshLambertMaterial({map:LT[l.k],color:new THREE.Color(l.h).multiplyScalar(l.sh),alphaTest:.05,transparent:true,side:THREE.DoubleSide}));
 m.rotation.order='YXZ';m.position.set(l.x,l.y,l.z);m.rotation.set(l.rx,l.ry,l.rz);m.scale.setScalar(l.s);W.add(m);
 const a=m.position.clone(),b=new THREE.Vector3(),s0=l.s,ox=(Math.random()-.5)*.5,oy=-.1-Math.random()*.2;let t=-delay;
 fx.push(dt=>{t+=dt;if(t<0)return;cam.localToWorld(b.set(ox,oy,-.6));const k=Math.min(1,t/.5),e=k*k*(3-2*k);m.position.lerpVectors(a,b,e);m.rotation.y+=dt*10;m.rotation.x+=dt*3;m.scale.setScalar(s0*(1+.5*e));
  if(t>.5)m.material.opacity=Math.max(0,1-(t-.5)/.8);if(t>1.3){W.remove(m);m.material.dispose();return 1}})}
function spark(P,n,c){for(let i=0;i<n;i++){const m=new THREE.Mesh(SG,new THREE.MeshBasicMaterial({color:c,transparent:true}));m.position.copy(P);m.scale.setScalar(.5+Math.random()*.5);const v=new THREE.Vector3((Math.random()-.5)*1.6,1+Math.random(),(Math.random()-.5)*1.6);W.add(m);let t=0;fx.push(dt=>{t+=dt;m.position.addScaledVector(v,dt);v.y-=4*dt;m.material.opacity=1-t/.8;if(t>.8){W.remove(m);return 1}})}}
function floatTxt(txt){const d=document.createElement('div');d.className='fl';d.textContent=txt;d.style.marginLeft=(Math.random()*80-40)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}

/* ---------- audio ---------- */
let AC,NB,wg;
function aud(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const sr=AC.sampleRate,b=AC.createBuffer(1,sr*2,sr),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NB=b;
 const s=AC.createBufferSource();s.buffer=b;s.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=420;wg=AC.createGain();s.connect(f);f.connect(wg);wg.connect(AC.destination);s.start();bird()}
 if(AC.state==='suspended')AC.resume();wg.gain.value=S.snd?.05:0}catch(e){}}
function tone(f,f2,d,ty,v,dl){if(!AC||!S.snd)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(dl||0);o.type=ty;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
function bird(){setTimeout(bird,3500+Math.random()*5000);if(Math.random()<.7){const b=2200+Math.random()*1200,n=2+(Math.random()*3|0);for(let i=0;i<n;i++)tone(b,b*1.3,.1,'sine',.025,i*.15)}}
function rustle(n){if(!AC||!S.snd)return;const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2500;const g=AC.createGain(),t=AC.currentTime;g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(Math.min(.35,.1+n*.03),t+.04);g.gain.exponentialRampToValueAtTime(.001,t+.3);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t,Math.random(),.35)}

/* ---------- game logic ---------- */
const need=l=>Math.floor(30*Math.pow(l,1.45));
function ui(){const t=TOOLS[S.cur],z=ZONES[S.zi],cn=capN?Math.max(0,Math.min(100,Math.round(100*(1-leaves.length/capN)))):0;$('lvn').textContent=S.lv;$('xpb').style.width=Math.min(100,100*S.xp/need(S.lv))+'%';$('xpt').textContent=S.xp+'/'+need(S.lv);$('coins').textContent=Math.floor(S.coins);$('bTool').textContent=t.e+' '+t.n+' · 商店';$('zname').textContent=z.e+' '+z.n+'　清洁度 '+cn+'%　共捡 '+S.col[S.zi]+' 片';$('zb').style.width=cn+'%'}
function addXp(x){S.xp+=x;let up=0;while(S.xp>=need(S.lv)){S.xp-=need(S.lv);S.lv++;up=1}if(up){toast('🎉 升级啦！Lv '+S.lv);[523,659,784,1047].forEach((f,i)=>tone(f,f,.25,'triangle',.12,i*.1))}}
let px=0,pz=0,yaw=0,pitch=-.3,act=null,bob=0,amp=0,T=0,sp=1,gu=22,pc=15,ut=1,jx=0,jy=0,jid=null,dn=null;
function pick(){const L=aim;if(!L)return;const tool=TOOLS[S.cur],z=ZONES[S.zi],P=new THREE.Vector3(L.x,L.y+.1,L.z);setAim(null);
 const c=[];for(const l of leaves){if(l.f)continue;const dx=l.x-L.x,dy=l.y-L.y,dz=l.z-L.z,d=Math.sqrt(dx*dx+dy*dy+dz*dz);if(d<=tool.r)c.push([l,d])}
 c.sort((a,b)=>a[1]-b[1]);c.length=Math.min(c.length,tool.m);
 c.forEach((a,i)=>{fly(a[0],i*.03)});c.forEach(a=>rm(a[0]));
 const n=c.length,g=Math.ceil(n*tool.v*z.m);S.coins+=g;S.col[S.zi]+=n;S.total+=n;act={ph:0};
 spark(P,Math.min(12,3+n),0xffe27a);floatTxt('+'+g+' 🪙');rustle(n);addXp(n*2);ui();save();xh.classList.add('hit');setTimeout(()=>xh.classList.remove('hit'),130)}
function go(zi){S.zi=zi;build(zi);px=0;pz=ZONES[zi].s-2.5;yaw=0;pitch=-.3;act=null;ui();save()}
cv.addEventListener('pointerdown',e=>{dn={lx:e.clientX,ly:e.clientY,m:0,t:performance.now(),r:e.clientX>innerWidth/2};try{cv.setPointerCapture(e.pointerId)}catch(x){}aud()});
cv.addEventListener('pointermove',e=>{if(!dn)return;const dx=e.clientX-dn.lx,dy=e.clientY-dn.ly;dn.lx=e.clientX;dn.ly=e.clientY;dn.m+=Math.abs(dx)+Math.abs(dy);if(dn.m>10){yaw-=dx*.005;pitch=Math.max(-1.2,Math.min(.5,pitch-dy*.005))}});
cv.addEventListener('pointerup',()=>{if(dn&&dn.r&&dn.m<=10&&performance.now()-dn.t<=350&&!act)pick();dn=null});
cv.addEventListener('pointercancel',()=>{dn=null});
const joy=$('joy'),kn=$('knob');
function jmv(e){const r=joy.getBoundingClientRect();let dx=e.clientX-(r.left+62),dy=e.clientY-(r.top+62);const d=Math.hypot(dx,dy),m=Math.min(d,46);if(d>0){dx*=m/d;dy*=m/d}kn.style.transform='translate('+dx+'px,'+dy+'px)';jx=dx/46;jy=dy/46}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;try{joy.setPointerCapture(e.pointerId)}catch(x){}aud();jmv(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmv(e)});
const jend=e=>{if(e.pointerId===jid){jid=null;jx=jy=0;kn.style.transform=''}};
joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
function rs(){const w=innerWidth,h=innerHeight,a=w/h;R.setSize(w,h);cam.aspect=a;cam.fov=a<1?78:62;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();

function step(dt){
 T+=dt;const tool=TOOLS[S.cur],s=ZONES[S.zi].s,jm=Math.hypot(jx,jy);let mv=0;
 if(jm>.08){const f=-jy,sn=Math.sin(yaw),cs=Math.cos(yaw);px+=(-sn*f+cs*jx)*4.5*dt;pz+=(-cs*f-sn*jx)*4.5*dt;mv=Math.min(1,jm)}
 px=cl(px,s-.8);pz=cl(pz,s-.8);
 if(act){act.ph+=dt/tool.t;if(act.ph>=1)act=null}
 if(dn&&dn.r&&dn.m<=10&&performance.now()-dn.t>350&&!act)pick();
 bob+=mv*dt*9;amp+=(mv-amp)*Math.min(1,dt*8);
 cam.position.set(px,1.6+Math.sin(bob)*.04*amp,pz);cam.rotation.set(pitch-(act?Math.sin(Math.min(1,act.ph)*Math.PI)*.015:0),yaw,0);cam.updateMatrixWorld();
 aimUpdate();
 const wind=.15+.12*Math.sin(T*.3);
 for(let j=falling.length-1;j>=0;j--){const l=falling[j];l.y-=.75*dt;l.x=cl(l.x+(Math.sin(T*1.7+l.ph)*.5+wind*3)*dt,s-.5);l.z=cl(l.z+Math.cos(T*1.3+l.ph)*.3*dt,s-.5);l.rx=Math.sin(T*3+l.ph)*.9;l.rz=Math.cos(T*2.4+l.ph)*.9;l.ry+=dt;
  if(l.y<=.06){l.f=0;l.y=.04+Math.random()*.1;l.rx=l.tx;l.rz=l.tz;falling.splice(j,1)}setM(l)}
 sp-=dt;if(sp<=0){sp=Math.max(.15,.4-S.zi*.08);if(leaves.length<capN)drop()}
 gu-=dt;if(gu<=0){gu=25;for(let j=0;j<20&&leaves.length<capN;j++)drop()}
 pc-=dt;if(pc<=0){pc=15;if(leaves.length<capN*.12){scatter(Math.round(capN*.3));pile();pile();toast('🍃 风吹来了一大批落叶')}}
 ut-=dt;if(ut<=0){ut=1;ui()}
 for(let j=fx.length-1;j>=0;j--)if(fx[j](dt))fx.splice(j,1)}
let t0=performance.now();

$('bTool').onclick=shop;$('bMap').onclick=map;$('bSet').onclick=sett;
$('mx').onclick=()=>$('modal').classList.remove('on');
$('modal').onclick=e=>{if(e.target.id=='modal')$('modal').classList.remove('on')};
$('mb').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
 if(d.b!=null){const i=+d.b,t=TOOLS[i];if(!S.tools[i]){if(S.coins<t.c)return toast('金币还不够哦');S.coins-=t.c;S.tools[i]=1;tone(900,1500,.18,'sine',.1)}S.cur=i;ui();save();shop()}
 else if(d.z!=null){const i=+d.z,z=ZONES[i];if(!S.zones[i]){if(S.lv<z.L)return toast('需要先升到 Lv '+z.L);if(S.coins<z.c)return toast('金币还不够哦');S.coins-=z.c;S.zones[i]=1;tone(900,1500,.18,'sine',.1)}go(i);$('modal').classList.remove('on')}
 else if(d.s=='snd'){S.snd=S.snd?0:1;aud();save();sett()}
 else if(d.s=='rst'){if(!d.a){b.dataset.a=1;b.textContent='再点一次确认';return}noSave=1;try{localStorage.removeItem(KEY)}catch(x){}location.reload()}};

addEventListener('pagehide',save);document.addEventListener('visibilitychange',save);setInterval(save,5000);
go(S.zi);requestAnimationFrame(loop);
